services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gvox
      POSTGRES_PASSWORD: gvox
      POSTGRES_DB: gvox
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gvox"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      ROLE: api
      DATABASE_URL: postgresql+asyncpg://gvox:gvox@postgres:5432/gvox
      INTERNAL_API_URL: http://api:8080
    volumes:
      - engine-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      ROLE: worker
      WORKER_ID: worker
      DATABASE_URL: postgresql+asyncpg://gvox:gvox@postgres:5432/gvox
      INTERNAL_API_URL: http://api:8080
      WORKER_INTERNAL_URL: http://worker:8091
    volumes:
      - engine-data:/app/data
    depends_on: [api]
    restart: on-failure          # a worker that exited after draining must not be restarted on the old image
    stop_grace_period: 16m      # > DRAIN_TIMEOUT_SECONDS: let live calls finish on SIGTERM

  # Standby worker for blue/green deploys: `docker compose --profile standby up -d worker-b`, then
  # `POST /v1/workers/worker/drain`; new streams land on worker-b while `worker` finishes its calls.
  worker-b:
    build: .
    env_file: .env
    environment:
      ROLE: worker
      WORKER_ID: worker-b
      DATABASE_URL: postgresql+asyncpg://gvox:gvox@postgres:5432/gvox
      INTERNAL_API_URL: http://api:8080
      WORKER_INTERNAL_URL: http://worker-b:8091
    volumes:
      - engine-data:/app/data
    depends_on: [api]
    profiles: ["standby"]
    restart: on-failure          # a worker that exited after draining must not be restarted on the old image
    stop_grace_period: 16m

  caddy:
    image: caddy:2
    ports: ["8080:8080", "8090:8090"]
    environment:
      CARRIER_MEDIA_IPS: ${CARRIER_MEDIA_IPS:-0.0.0.0/0 ::/0}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [api, worker]
    restart: unless-stopped

volumes:
  engine-data:
  pg-data:
