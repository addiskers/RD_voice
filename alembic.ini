# Alembic configuration for gvox-voice. The engine runs migrations itself on startup
# (engine.api.db.run_migrations); this file is for the CLI: `alembic revision --autogenerate -m "..."`.
[alembic]
script_location = engine/api/migrations
sqlalchemy.url = sqlite+aiosqlite:///./data/engine.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
